# CI for Cardioplace BP Alerts.
#
# ## What this pipeline proves
#
# Job 1 (import smoke) is the highest-value check here by a wide margin. This repository
# shipped for some time with `src/utils/ml_utils/safety/` referenced by an import and absent
# from disk, which made `main.py` unrunnable. A one-line `walk_packages` loop catches that
# class of defect the moment it lands.
#
# ## What this pipeline does NOT prove
#
# Stated explicitly, because a green tick is read as more than it is. CI here does not
# establish:
#
#   * that the served forecast is numerically correct;
#   * that train/serve feature parity holds on real data -- only `leakage_audit` and
#     `cadence_audit` inside a full run touch that, and they need the 251 MB corpus;
#   * that the 56 rules encode the clinical semantics anyone intends;
#   * that the 80% conformal interval achieves 80% coverage;
#   * that the detector cut holds its 5% budget on real traffic;
#   * anything at all about the symptom heads, whose labels are synthetic by construction.
#
# The three tests most worth writing next, in order: a golden-file test pinning
# ExtendedRuleEngine's exact rule_id sequence over a fixed 30-row frame; a parity test
# asserting build_panel_frame(h).iloc[-1] equals transform_for_inference(h[:-1]) on every
# shipped feature; and a loader round-trip over both on-disk artifact shapes.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      # 1. Every module must import. This is the check that would have caught the missing
      #    safety package on the commit that introduced it.
      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          bad = []
          for m in pkgutil.walk_packages(["src"], "src."):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  bad.append(f"{m.name}: {type(e).__name__}: {e}")
          # Both entry points: `app` is the FastAPI/SPA one, `gradio_app` is what the
          # Hugging Face Space actually launches. A Space that fails to import is a Space
          # that shows a stack trace to every visitor.
          for entry in ("app", "gradio_app"):
              try:
                  importlib.import_module(entry)
              except Exception as e:
                  bad.append(f"{entry}: {type(e).__name__}: {e}")
          print("\n".join(bad) or "all modules import")
          sys.exit(1 if bad else 0)
          PY

      # 2. The API must not import the training graph. Break this and the API stops booting
      #    whenever a training module does, which defeats the whole no-model design.
      - name: Layering guard
        run: |
          if grep -rnE '^\s*(from|import)\s+src\.(components|pipeline)' src/serving app.py gradio_app.py; then
            echo "::error::src/serving and the entry points must not import src.components or src.pipeline"
            exit 1
          fi
          echo "layering respected"

      - name: Lint
        run: ruff check src app.py gradio_app.py main.py tests

      # 3. Dependency files must agree. They had already drifted once.
      - name: Dependency reconciliation
        run: |
          python - <<'PY'
          import re, sys, tomllib
          proj = tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]
          def name(s): return re.split(r"[<>=\[]", s, 1)[0].strip().lower()
          a = {name(d) for d in proj}
          b = {name(l) for l in open("requirements.txt")
               if l.strip() and not l.startswith("#")}
          bad = []
          if a - b: bad.append(f"in pyproject only: {sorted(a-b)}")
          if b - a: bad.append(f"in requirements only: {sorted(b-a)}")
          # dagshub only: it was imported and never called. gradio is back on purpose --
          # the Space runs `sdk: gradio` because Docker Spaces need a PRO subscription.
          for banned in ("dagshub",):
              if banned in a or banned in b: bad.append(f"{banned} should have been removed")
          print("\n".join(bad) or f"{len(a)} dependencies agree")
          sys.exit(1 if bad else 0)
          PY

      # 3b. The Space must build on an interpreter that can satisfy the pins AND that its
      #     hardware actually supports. Both bounds are here because both were learned the
      #     hard way, over five failed builds with a byte-identical error message:
      #
      #       * floor -- the Space image defaults to 3.10 and the README set no
      #         `python_version`, so `pip install -r requirements.txt` died on "No matching
      #         distribution found for numpy==2.4.2" (numpy 2.4.2, scipy 1.16.0: >=3.11).
      #       * ceiling -- setting "3.11" did not fix it. This Space runs ZeroGPU, which
      #         supports only 3.12.12 and 3.10.13; anything else is discarded and the build
      #         silently falls back to 3.10.13 while the Hub API reports the requested
      #         version back to you. Cheerful metadata over a broken build is why this took
      #         five cycles, and why the ceiling is asserted rather than trusted.
      #
      #     CI cannot observe either failure -- it picks its own interpreter -- so this
      #     comparison is the only thing linking a green tick to a Space that can build.
      - name: Space interpreter guard
        run: |
          python - <<'PY'
          import re, sys, tomllib, yaml
          floor = tomllib.load(open("pyproject.toml","rb"))["project"]["requires-python"]
          m = re.match(r">=\s*(\d+)\.(\d+)", floor)
          if not m:
              sys.exit(f"cannot read a >=X.Y floor out of requires-python {floor!r}")
          want = (int(m[1]), int(m[2]))

          text = open("README.md", encoding="utf-8").read()
          if not text.startswith("---"):
              sys.exit("README.md has no Space front matter")
          fm = yaml.safe_load(text.split("---", 2)[1])
          got = fm.get("python_version")
          if got is None:
              sys.exit(f"README front matter must set python_version (>= {want[0]}.{want[1]}); "
                       "without it the Space image defaults to 3.10")
          # Quote it in YAML: bare 3.10 parses as the float 3.1, which compares wrong.
          if not isinstance(got, str):
              sys.exit(f"python_version must be quoted in YAML; got {got!r} ({type(got).__name__})")
          have = tuple(int(p) for p in got.split(".")[:2])
          if have < want:
              sys.exit(f"README python_version {got} is below requires-python {floor}; "
                       "the Space cannot install the pinned numeric stack")
          # Compared at (major, minor): ZeroGPU documents 3.12.12, and "3.12" resolves to it.
          ZEROGPU_SUPPORTED = {(3, 12), (3, 10)}
          if have not in ZEROGPU_SUPPORTED:
              sys.exit(f"README python_version {got} is not a ZeroGPU interpreter "
                       f"{sorted(ZEROGPU_SUPPORTED)}; a ZeroGPU Space ignores it and builds "
                       "on 3.10.13 instead, which cannot install the pinned stack")
          # setup-python above must match, or a green tick says nothing about the Space.
          ci = yaml.safe_load(open(".github/workflows/deploy.yaml", encoding="utf-8"))
          pins = {s["with"]["python-version"]
                  for j in ci["jobs"].values() for s in j["steps"]
                  if str(s.get("uses","")).startswith("actions/setup-python")}
          if {tuple(int(p) for p in v.split(".")[:2]) for v in pins} != {have}:
              sys.exit(f"setup-python pins {sorted(pins)} but the Space runs {got}; "
                       "CI must run the interpreter it is vouching for")
          print(f"Space, CI and requires-python all agree on Python {got}")
          PY

      # 4. Governance and safety gates: every critical gate must be able to FAIL. A gate
      #    that cannot fail reports PASS forever and is read as evidence.
      - name: Safety gate self-test
        run: python tests/test_safety_gates.py

      # 5. The API contract, on both the no-model and with-model paths. In CI there is no
      #    bundle, so the no-model half runs -- which is the interesting half: an SBP of 195
      #    must still produce an emergency with nothing on disk.
      - name: API contract
        run: python tests/test_api_contract.py

      # 6. The Space is a second front end over the same advisory. This asserts it cannot
      #    drift into disagreeing with /api/predict about the same patient.
      - name: Space contract
        run: python tests/test_space_contract.py

      # 7. The joint checks. None of these need a trained bundle, which is the point --
      #    they guard the paths that must be right BEFORE there is a model to be wrong about.
      - name: Forecast pair coherence
        run: python tests/test_coherence.py

      - name: Serving features actually arrive
        run: python tests/test_serving_features.py

      - name: Symptom chain and the Jensen correction
        run: python tests/test_symptom_chain.py

      - name: Test suite
        run: pytest

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN / HF_SPACE not configured; skipping deploy"; exit 0
          fi
          # No [cli] extra: huggingface_hub 1.x ships the `hf` entry point in the base
          # package and warns that the extra does not exist.
          pip install -U huggingface_hub
          # One pattern per --exclude. The flag takes a single value, so passing several
          # after one flag makes the rest positional and `hf upload` rejects them as
          # unexpected extra arguments.
          #
          # data/ is excluded because the Space serves the model, not the corpus -- and the
          # checkout holds LFS pointers anyway, since actions/checkout does not fetch LFS
          # by default. Artifacts/, logs/ and mlruns/ are run outputs.
          hf upload "$HF_SPACE" . . --repo-type=space \
            --commit-message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --exclude "data/*" \
            --exclude "Artifacts/*" \
            --exclude "logs/*" \
            --exclude "mlruns/*" \
            --exclude "notebooks/*" \
            --exclude "**/__pycache__/*" \
            --exclude "*.tmp"

          # Factory-reboot on every push, so a config change is never silently served from
          # cached layers.
          #
          # Do NOT add request_space_hardware here. It was tried, and HF answers
          # `402 Payment Required` -- "Without a PRO subscription, you can't downgrade this
          # Space to cpu-basic" -- so a free account cannot change Space hardware through the
          # API at all, not even downwards. The interpreter is therefore chosen to suit the
          # hardware rather than the other way round; see README's python_version note.
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          space = os.environ["HF_SPACE"]
          # restart_space, not request_space_restart -- the latter does not exist in
          # huggingface_hub 1.x and fails with AttributeError.
          rt = HfApi(token=os.environ["HF_TOKEN"]).restart_space(space, factory_reboot=True)
          print(f"Factory reboot requested for {space}; stage is now {rt.stage}")
          PY
          echo "Deployed. The Space runs rule-engine-only until a promoted"
          echo "final_model/model.pkl is present -- see the README's degraded-path note."
