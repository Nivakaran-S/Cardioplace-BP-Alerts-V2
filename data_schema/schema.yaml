# HEMOBP session schema -- one row per (patient, dialysis session), produced by data ingestion
# from data/vip.csv (intradialytic vitals), data/d1.csv (session records) and
# data/idp.csv (demographics).
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the session contract. The Python constants in
# src/constants/training_pipeline/__init__.py read it at import and assert agreement, so a
# value changed here and nowhere else takes effect, and a value that disagrees with the code
# fails the run at import rather than silently at scoring time.
#
# A session is a contiguous run of readings (gap > session_gap_hours starts a new one),
# assigned to the dialysis day beginning at dialysis_day_start_hour. It is NOT a calendar
# date: three shifts a day run in this corpus and the last crosses midnight.

columns:
  - patient_id: object
  - ts: datetime64[ns]                # the dialysis day the session belongs to
  - session_start: datetime64[ns]     # first admissible reading of the session
  - session_end: datetime64[ns]       # last admissible reading of the session
  - session_hours: float64            # session_end - session_start, hours
  - session_source: object            # d1 | vip_only -- whether d1 recorded this session
  - sbp: int64
  - dbp: int64
  - sbp_post: int64
  - sbp_min: int64
  - sbp_drop: int64
  - uf_total: float64
  - n_meas: int64
  - weightstart: float64
  - weightend: float64
  - dryweight: float64
  - temperature: float64
  - weight: float64
  - idwg: float64
  - gender: object
  - age: float64
  - DM: float64


numerical_columns:
  - sbp
  - dbp
  - sbp_post
  - sbp_min
  - sbp_drop
  - uf_total
  - n_meas
  - session_hours
  - weightstart
  - weightend
  - dryweight
  - temperature
  - weight
  - idwg
  - age
  - DM


# Physiological admission ranges enforced by the data contract in
# src/components/data_validation.py. A column may exceed its range on at most
# max_out_of_range of rows before the check fails.
ranges:
  sbp: [60, 260]
  dbp: [30, 160]
  weight: [25, 220]
  idwg: [-5, 12]
  age: [18, 110]
  temperature: [33, 41]
  session_hours: [0.5, 12.0]
  min_pulse_pressure: 10

max_out_of_range: 0.005


# The forecast targets, generated by the causal feature builder as y_<signal>_h<horizon>.
target_signals:
  - sbp
  - dbp
  - idwg

# Horizons are TARGET SHIFTS, so they start at 0: y_sbp_h0 is the next reading, not the
# current one. The advisory reports these as steps_ahead = h + 1, which is why a run labelled
# h0/h1/h2 surfaces as "+1/+2/+3 sessions" in the UI. This file previously said [1, 2, 3],
# which described the surfaced labels rather than the shifts and disagreed with the code.
horizons:
  - 0
  - 1
  - 2
